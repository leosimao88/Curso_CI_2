name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    env: 
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: root
    strategy:
      matrix:
        go_version: ['1.18', '1.17', '>=1.18']
        os: ['ubuntu-latest', 'ubuntu-18.04']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Wait for DB to be ready
      run: |
        echo "Waiting for Postgres to become available..."
        # Wait for container to be up and port exposed
        for i in {1..30}; do
          nc -z localhost 5432 && break || true
          echo "Waiting for Postgres port... ($i)"
          sleep 1
        done
        # Try to ensure DB service is ready using pg_isready inside container
        for i in {1..30}; do
          docker compose exec -T postgres pg_isready -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} && break || true
          echo "Checking Postgres readiness... ($i)"
          sleep 1
        done

    - name: Test
      run: go test -v main_test.go 
      
  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-18.04']
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go
