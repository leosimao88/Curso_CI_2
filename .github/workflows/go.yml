name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    env: 
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: root
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        go_version: ['1.18', '1.17', '>=1.18']
        os: ['ubuntu-latest', 'ubuntu-18.04']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Wait for Postgres to be ready
      run: |
        echo "Waiting for Postgres to become available..."
        for i in {1..60}; do
          # try to open a TCP socket to the port
          if bash -c "cat < /dev/tcp/127.0.0.1/5432" 2>/dev/null; then
            echo "Postgres port is open"
            break
          fi
          echo "Waiting for Postgres... ($i/60)"
          sleep 1
        done
        # also wait for the server to accept connections using pg_isready if available
        if command -v pg_isready >/dev/null 2>&1; then
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} && break || true
            echo "Checking Postgres readiness with pg_isready... ($i)"
            sleep 1
          done
        fi

      - name: Debug: show docker and port status
        run: |
          echo "List Linux listening sockets for 5432"
          ss -ltnp | grep 5432 || true
          echo "Docker containers running (filter postgres)"
          docker ps --filter ancestor=postgres --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          # Attempt to show logs for the postgres container if found
          cid=$(docker ps --filter ancestor=postgres --format '{{.ID}}' | head -n1)
          if [ ! -z "$cid" ]; then
            echo "Logs for container $cid"
            docker logs $cid || true
          fi

    - name: Test
      run: go test -v main_test.go 
      
  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-18.04']
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go
